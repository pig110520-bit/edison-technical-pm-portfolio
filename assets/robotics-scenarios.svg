<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif}.label{font:700 14px Arial;letter-spacing:2.5px;fill:#8da48a}.title{font:700 34px Arial,'Microsoft JhengHei';fill:#273c2c}.h{font:700 22px Arial,'Microsoft JhengHei';fill:#29402f}.body{font:17px Arial,'Microsoft JhengHei';fill:#586a59}</style><rect width="1200" height="600" rx="22" fill="#f3efe9"/><text x="58" y="72" class="label">PRODUCT PLANNING / INTERACTION SCENARIOS</text><text x="58" y="125" class="title">Making complex functions demonstrable.</text><rect x="57" y="194" width="345" height="305" rx="15" fill="white"/><rect x="429" y="194" width="345" height="305" rx="15" fill="white"/><rect x="801" y="194" width="343" height="305" rx="15" fill="white"/><text x="84" y="236" class="label">SCENE 01</text><text x="84" y="299" class="h">Voice inquiry</text><text x="84" y="350" class="body">以語音詢問天氣，</text><text x="84" y="383" class="body">展示自然語言互動入口</text><text x="84" y="456" class="body">功能方向：語音互動</text><text x="456" y="236" class="label">SCENE 02</text><text x="456" y="299" class="h">Guided navigation</text><text x="456" y="350" class="body">指定茶水間、玄關等</text><text x="456" y="383" class="body">預設位置進行移動展示</text><text x="456" y="456" class="body">功能方向：定點導航</text><text x="828" y="236" class="label">SCENE 03</text><text x="828" y="299" class="h">Obstacle response</text><text x="828" y="350" class="body">透過現場障礙情境，</text><text x="828" y="383" class="body">展示機器人的避障能力</text><text x="828" y="456" class="body">功能方向：移動安全</text><text x="57" y="548" style="font:14px Arial,'Microsoft JhengHei';fill:#858783">The scenarios above are grounded in a dated demo script; they do not represent a complete production QA sign-off.</text></svg>