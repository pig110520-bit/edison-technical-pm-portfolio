<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edison Portfolio｜檔案健康檢查</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f8f9f4;color:#222;max-width:800px;margin:auto;padding:24px;line-height:1.7}h1{font-size:26px} .ok{color:#236a3a}.bad{color:#b52b2b}li{padding:8px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}a{color:#265339}.hint{background:#e7f0e1;padding:14px;border-radius:10px}small{color:#555}</style></head><body><h1>作品集檔案健康檢查</h1><p class="hint">這個頁面會從 GitHub Pages 上逐一確認頁面、CSS、圖片及 PDF 是否真的能載入。若看到紅色的「缺少」，表示公開網站上該路徑無法讀取，通常是上傳時遺漏或資料夾位置錯誤。</p><p id="status">檢查中…</p><ol id="results"></ol><p><a href="index.html">返回作品集首頁</a></p><script>const paths=["index.html", "styles.css", "resume.html", "projects/voucher-system.html", "projects/automation-tools.html", "projects/projectflow.html", "projects/robotics.html", "assets/Edison_Chang_Resume.pdf", "assets/voucher-workflow-concept.svg", "assets/robotics-scenarios.svg", "assets/screenshots/dashboard.webp", "assets/screenshots/project.webp", "assets/screenshots/wbs.webp", "assets/screenshots/task.webp", "assets/screenshots/issue.webp", "assets/screenshots/risk.webp", "assets/screenshots/worklog.webp", "assets/screenshots/dependency.webp", "assets/screenshots/members.webp", "assets/automation-evidence/reconciliation.webp", "assets/automation-evidence/points-gui.webp", "assets/automation-evidence/lookup-gui.webp", "assets/automation-evidence/lookup-results.webp"]; const status=document.getElementById('status'), list=document.getElementById('results');Promise.all(paths.map(async path=>{let ok=false,code='';try{const res=await fetch(path+'?check='+Date.now(),{cache:'no-store'});ok=res.ok;code=String(res.status)}catch(e){code='網路錯誤'}return {path,ok,code}})).then(rows=>{let count=0; for(const r of rows){if(r.ok)count++;const li=document.createElement('li');const label=document.createElement('strong');label.className=r.ok?'ok':'bad';label.textContent=r.ok?'✓ 正常 ':'✕ 缺少 ';const link=document.createElement('a');link.href=r.path;link.textContent=r.path;li.append(label,link,document.createTextNode(' ('+r.code+')'));list.append(li)}status.textContent='檢查完成：'+count+' / '+rows.length+' 項正常';status.className=count===rows.length?'ok':'bad'})</script></body></html>
